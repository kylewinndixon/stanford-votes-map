<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stanford Votes Map</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .view-map-button {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
        
            background: white;
            border: 1px solid #bbb;
            border-radius: 6px;
        
            padding: 8px 12px;
        
            font-family: Arial, sans-serif;
            font-size: 14px;
        
            text-decoration: none;
            color: #222;
        
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
        }
        
        .view-map-button:hover {
            background: #f5f5f5;
        }

        .leaflet-div-icon {
            background: transparent;
            border: none;
        }
        
        .custom-marker {
            width: 34px;
            height: 34px;
        
            border-radius: 50%;
        
            display: flex;
            align-items: center;
            justify-content: center;
        
            color: white;
        
            font-size: 15px;
        
            box-shadow: 0 3px 10px rgba(31,36,48,.22);
        
            border: 3px solid white;
        
            transition: transform .15s ease;
        }
        
        .custom-marker:hover{
            transform: scale(1.12);
        }
        
        .legend-marker{
            display:inline-flex;
            align-items:center;
            justify-content:center;
        
            width:22px;
            height:22px;
        
            border-radius:50%;
        
            color:white;
        
            margin-right:8px;
        
            font-size:11px;
        
            vertical-align:middle;
        
            box-shadow:0 2px 6px rgba(0,0,0,.15);
        }
        
    </style>
    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<a
    class="view-map-button"
    href="https://kylewinndixon.github.io/stanford-votes-map/"
    target="_blank"
>
    View Larger Map
</a>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
<script>

const map = L.map('map', {
    scrollWheelZoom: false,
    zoomControl: false
});

L.control.zoom({
    position: 'bottomright'
}).addTo(map);
    
L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 20
    }
).addTo(map);

function createIcon(color, icon){

    return L.divIcon({

        className: "",

        html: `
        <div class="custom-marker" style="background:${color}">
            <i class="fa-solid ${icon}"></i>
        </div>
        `,

        iconSize:[34,34],

        iconAnchor:[17,17],

        popupAnchor:[0,-17]

    });

}

const ballotIcon = createIcon("#F4B942","fa-check");

const postOfficeIcon = createIcon("#2F3A44","fa-building-columns");

const mailboxIcon = createIcon("#5D8AA8","fa-envelope");

const votingCenterIcon = createIcon("#C92535","fa-person-booth");
    const markers = [];

function addMarker(lat, lng, icon, popupHTML) {

    const marker = L.marker([lat, lng], {
        icon: icon
    }).addTo(map);

    marker.bindPopup(popupHTML);

    marker.on('mouseover', function () {
        this.openPopup();
    });

    marker.on('mouseout', function () {
        this.closePopup();
    });

    marker.on('click', function () {
        this.openPopup();
    });

    markers.push(marker);
}
    
function popup(title, subtitle) {
    return `
        <div style="
            font-family:Avenir,'Avenir Next',Helvetica,Arial,sans-serif;
            line-height:1.4;
        ">
            <div style="
                font-weight:600;
                font-size:15px;
                color:#1F2430;
            ">
                ${title}
            </div>

            <div style="
                font-weight:300;
                font-size:13px;
                color:#555;
            ">
                ${subtitle}
            </div>
        </div>
    `;
}
addMarker(
    37.433425,
    -122.176911,
    ballotIcon,
    popup("Stanford Hospital", "Ballot Box")
);

addMarker(
    37.444369,
    -122.159922,
    ballotIcon,
    popup("Palo Alto City Hall", "Ballot Box")
);

addMarker(
    37.435061,
    -122.155825,
    ballotIcon,
    popup("Palo Alto High School", "Ballot Box")
);

addMarker(
    37.424303,
    -122.168892,
    postOfficeIcon,
    popup("Stanford Post Office", "Post Office")
);

addMarker(
    37.445844,
    -122.159239,
    postOfficeIcon,
    popup("Palo Alto Post Office","Post Office")
);

addMarker(
    37.428647,
    -122.143928,
    postOfficeIcon,
    popup("California Avenue Post Office","Post Office")
);

addMarker(
    37.429125,
    -122.169039,
    mailboxIcon,
    popup("USPS @ The Oval","USPS Blue Box")
);

addMarker(
    37.426492,
    -122.150878,
    mailboxIcon,
    popup("USPS @ EVGR","USPS Blue Box")
);

addMarker(
    37.424303,
    -122.170842,
    votingCenterIcon,
    popup("Tresidder Voting Center", "Oak Lounge (2nd Floor)")
);

addMarker(
    37.423453,
    -122.158500,
    votingCenterIcon,
    popup("EVGR Voting Center", "Graduate Student Community Center<br>Havana Room")
);

const group = L.featureGroup(markers);

const legend = L.control({ position: 'bottomleft' });

legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'info legend');

    div.style.background = 'rgba(236,230,214,.92)';
    div.style.padding = '14px';
    div.style.border = '1px solid #D7CFBE';
    div.style.borderRadius = '12px';
    div.style.boxShadow = '0 4px 12px rgba(31,36,48,.12)';
    div.style.fontFamily = 'Avenir, "Avenir Next", Helvetica, Arial, sans-serif';
    div.style.fontSize = '14px';
    div.style.color = '#1F2430';

    div.innerHTML = `
        <b style="font-family:Avenir,'Avenir Next',Helvetica,sans-serif;
        font-size:15px;">Legend</b><br><br>
        
        <div style="margin-bottom:8px;">
        <span class="legend-marker" style="background:#F4B942;">
        <i class="fa-solid fa-check"></i>
        </span>
        Ballot Box
        </div>
        
        <div style="margin-bottom:8px;">
        <span class="legend-marker" style="background:#2F3A44;">
        <i class="fa-solid fa-building-columns"></i>
        </span>
        Post Office
        </div>
        
        <div style="margin-bottom:8px;">
        <span class="legend-marker" style="background:#5D8AA8;">
        <i class="fa-solid fa-box"></i>
        </span>
        USPS Blue Box
        </div>
        
        <div>
        <span class="legend-marker" style="background:#C92535;">
        <i class="fa-solid fa-person-booth"></i>
        </span>
        Voting Center
        </div>
        `;

    return div;
};

legend.addTo(map);
    
map.fitBounds(group.getBounds(), {
    padding: [50, 50]
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stanford Votes Map</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .view-map-button {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
        
            background: white;
            border: 1px solid #bbb;
            border-radius: 6px;
        
            padding: 8px 12px;
        
            font-family: Arial, sans-serif;
            font-size: 14px;
        
            text-decoration: none;
            color: #222;
        
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
        }
        
        .view-map-button:hover {
            background: #f5f5f5;
        }
        
    </style>
</head>

<body>

<a
    class="view-map-button"
    href="https://kylewinndixon.github.io/stanford-votes-map/"
    target="_blank"
>
    View Larger Map
</a>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map', {
    scrollWheelZoom: false,
    zoomControl: false
});

L.control.zoom({
    position: 'bottomright'
}).addTo(map);
    
L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 20
    }
).addTo(map);

const redIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25,41],
    iconAnchor: [12,41],
    popupAnchor: [1,-34],
    shadowSize: [41,41]
});

const blueIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25,41],
    iconAnchor: [12,41],
    popupAnchor: [1,-34],
    shadowSize: [41,41]
});

const greenIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25,41],
    iconAnchor: [12,41],
    popupAnchor: [1,-34],
    shadowSize: [41,41]
});

const yellowIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25,41],
    iconAnchor: [12,41],
    popupAnchor: [1,-34],
    shadowSize: [41,41]
});
    const markers = [];

function addMarker(lat, lng, icon, popupHTML) {

    const marker = L.marker([lat, lng], {
        icon: icon
    }).addTo(map);

    marker.bindPopup(popupHTML);

    marker.on('mouseover', function () {
        this.openPopup();
    });

    marker.on('mouseout', function () {
        this.closePopup();
    });

    marker.on('click', function () {
        this.openPopup();
    });

    markers.push(marker);
}

addMarker(
    37.433425,
    -122.176911,
    yellowIcon,
    "<b>Stanford Hospital</b><br>Ballot Box"
);

addMarker(
    37.444369,
    -122.159922,
    yellowIcon,
    "<b>Palo Alto City Hall</b><br>Ballot Box"
);

addMarker(
    37.435061,
    -122.155825,
    yellowIcon,
    "<b>Palo Alto High School</b><br>Ballot Box"
);

addMarker(
    37.424303,
    -122.168892,
    greenIcon,
    "<b>Stanford Post Office</b><br>Post Office"
);

addMarker(
    37.445844,
    -122.159239,
    greenIcon,
    "<b>Palo Alto Post Office</b><br>Post Office"
);

addMarker(
    37.428647,
    -122.143928,
    greenIcon,
    "<b>California Avenue Post Office</b><br>Post Office"
);

addMarker(
    37.429125,
    -122.169039,
    blueIcon,
    "<b>USPS @ The Oval</b><br>USPS Blue Box"
);

addMarker(
    37.426492,
    -122.150878,
    blueIcon,
    "<b>USPS @ EVGR</b><br>USPS Blue Box"
);

addMarker(
    37.424303,
    -122.170842,
    redIcon,
    "<b>Tresidder Voting Center</b><br>Oak Lounge (2nd Floor)"
);

addMarker(
    37.423453,
    -122.158500,
    redIcon,
    "<b>EVGR Voting Center</b><br>Graduate Student Community Center<br>Havana Room"
);

const group = L.featureGroup(markers);
map.fitBounds(group.getBounds(), {
    padding: [50, 50]
});

</script>

</body>
</html>

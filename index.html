<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stanford Votes Map</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .view-map-button {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
        
            background: white;
            border: 1px solid #bbb;
            border-radius: 6px;
        
            padding: 8px 12px;
        
            font-family: Arial, sans-serif;
            font-size: 14px;
        
            text-decoration: none;
            color: #222;
        
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
        }
        
        .view-map-button:hover {
            background: #f5f5f5;
        }
        
    </style>
   
    <link rel="stylesheet"
        href="css/leaflet.awesome-markers.css">
    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<a
    class="view-map-button"
    href="https://kylewinndixon.github.io/stanford-votes-map/"
    target="_blank"
>
    View Larger Map
</a>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/leaflet.awesome-markers.js"></script>
    
<script>

const map = L.map('map', {
    scrollWheelZoom: false,
    zoomControl: false
});

L.control.zoom({
    position: 'bottomright'
}).addTo(map);
    
L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 20
    }
).addTo(map);

const ballotIcon = L.AwesomeMarkers.icon({
    icon: 'check',
    prefix: 'fa',
    markerColor: 'orange'
});

const postOfficeIcon = L.AwesomeMarkers.icon({
    icon: 'envelope',
    prefix: 'fa',
    markerColor: 'green'
});

const mailboxIcon = L.AwesomeMarkers.icon({
    icon: 'envelope',
    prefix: 'fa',
    markerColor: 'blue'
});

const votingCenterIcon = L.AwesomeMarkers.icon({
    icon: 'building',
    prefix: 'fa',
    markerColor: 'red'
});
    const markers = [];

function addMarker(lat, lng, icon, popupHTML) {

    const marker = L.marker([lat, lng], {
        icon: icon
    }).addTo(map);

    marker.bindPopup(popupHTML);

    marker.on('mouseover', function () {
        this.openPopup();
    });

    marker.on('mouseout', function () {
        this.closePopup();
    });

    marker.on('click', function () {
        this.openPopup();
    });

    markers.push(marker);
}

addMarker(
    37.433425,
    -122.176911,
    ballotIcon,
    "<b>Stanford Hospital</b><br>Ballot Box"
);

addMarker(
    37.444369,
    -122.159922,
    ballotIcon,
    "<b>Palo Alto City Hall</b><br>Ballot Box"
);

addMarker(
    37.435061,
    -122.155825,
    ballotIcon,
    "<b>Palo Alto High School</b><br>Ballot Box"
);

addMarker(
    37.424303,
    -122.168892,
    postOfficeIcon,
    "<b>Stanford Post Office</b><br>Post Office"
);

addMarker(
    37.445844,
    -122.159239,
    postOfficeIcon,
    "<b>Palo Alto Post Office</b><br>Post Office"
);

addMarker(
    37.428647,
    -122.143928,
    postOfficeIcon,
    "<b>California Avenue Post Office</b><br>Post Office"
);

addMarker(
    37.429125,
    -122.169039,
    mailboxIcon,
    "<b>USPS @ The Oval</b><br>USPS Blue Box"
);

addMarker(
    37.426492,
    -122.150878,
    mailboxIcon,
    "<b>USPS @ EVGR</b><br>USPS Blue Box"
);

addMarker(
    37.424303,
    -122.170842,
    votingCenterIcon,
    "<b>Tresidder Voting Center</b><br>Oak Lounge (2nd Floor)"
);

addMarker(
    37.423453,
    -122.158500,
    votingCenterIcon,
    "<b>EVGR Voting Center</b><br>Graduate Student Community Center<br>Havana Room"
);

const group = L.featureGroup(markers);

const legend = L.control({ position: 'bottomleft' });

legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'info legend');

    div.style.background = 'white';
    div.style.padding = '10px';
    div.style.borderRadius = '8px';
    div.style.boxShadow = '0 2px 6px rgba(0,0,0,0.2)';
    div.style.font = '14px Arial';

    div.innerHTML = `
        <b>Legend</b><br><br>
        <i class="fa fa-check" style="color:#f4b400;"></i> Ballot Box<br>
        <i class="fa fa-envelope" style="color:#2e7d32;"></i> Post Office<br>
        <i class="fa fa-inbox" style="color:#1976d2;"></i> USPS Blue Box<br>
        <i class="fa fa-building" style="color:#c62828;"></i> Voting Center
    `;

    return div;
};

legend.addTo(map);
    
map.fitBounds(group.getBounds(), {
    padding: [50, 50]
});

</script>

</body>
</html>
